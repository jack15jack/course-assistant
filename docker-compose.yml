services:

  db:
    image: postgres:18

    container_name: study_assistant_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: study_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d study_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:

    build:
      context: ./backend

    container_name: study_assistant_backend

    env_file:
      - ./backend/.env

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./backend:/app

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      "

volumes:

  postgres_data: